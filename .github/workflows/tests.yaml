name: Run Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: golangci-lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --issues-exit-code=0 --timeout=5m

      - name: Run tests
        # Run sequentially to avoid conflicts with shared resources in Contentful.
        run: go test -p 1 -race -v ./...
        env:
          TF_ACC: 1
          CONTENTFUL_MANAGEMENT_TOKEN: ${{secrets.CONTENTFUL_MANAGEMENT_TOKEN}}
          CONTENTFUL_ORGANIZATION_ID: ${{vars.CONTENTFUL_ORGANIZATION_ID}}
          CONTENTFUL_SPACE_ID: ${{vars.CONTENTFUL_SPACE_ID}}

  changie:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release
        uses: labd/changie-release-action@43112f435367957ee3fefc64b3b712c7e672be33 # v0.6.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-workflow: "release.yaml"
